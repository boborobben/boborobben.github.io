<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>火石竞技 - 专业赛事计时器 BOBO设计</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title"="火石竞技">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4F46E5">
    <link rel="apple-touch-icon" href="LOGO-透明绿色.png">

    <style>
        :root {
            --primary: #4F46E5;
            --success: #10B988;
            --warning: #F59E0B;
            --accent: #06BBD4;
            --bg-set: #818CF8;
            --normal-set: #EC4899;
            --final-set: #9333EA;
            --gray: #64748B;
            --dark: #0F2524;
            --light: #ffffff;
            --glass: rgba(255,255,255,0.1);
            --glass-border: rgba(255,255,255,0.2);
            --timer-color: #ffffff;
            --info-color: #ffffff;
            --timer-font-size: 120px;
        }
        * { margin:0; padding:0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: url('./默认网页背景.jpg?v=3');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height:100vh;
            overflow:hidden;
            user-select:none;
        }
        .container { width:100vw; height:100vh; padding:20px; display:flex; flex-direction:column; justify-content:space-between; }
        .top-bar { display:flex; justify-content:space-between; align-items:center; }
        .logo-area { display:flex; align-items:center; gap:12px; }
        .logo-box { width:70px; height:70px; background:var(--glass); border:1px var(--glass-border); border-radius:16px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        .logo-img { width:100%; height:100%; object-fit:contain; }
        .logo-text { color:#fff; font-size:24px; font-weight:800; }
        .btn-group { display:flex; gap:8px; flex-wrap:wrap; }
        .btn { padding:10px 14px; border-radius:12px; border:none; color:white; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; transition:0.2s; background:var(--glass); border:1px solid var(--glass-border); }
        .btn:hover { transform:translateY(-2px); }
        .btn:disabled { opacity:0.5; }
        .btn-image { background:var(--bg-set) !important; }
        .btn-setting { background:var(--normal-set) !important; }
        .btn-final-set { background:var(--final-set) !important; }
        .btn-start { background:var(--success); }
        .btn-pause { background:var(--warning); }
        .btn-reset { background:var(--primary); }
        .btn-final { background:var(--accent); }
        .btn-jump { background: #8B5CF6 !important; }
        .btn-close { background: #ef4444 !important; }
        .btn-split { background: #0EA5E9 !important; }
        .btn-merge { background: #F43F5E !important; }
        .btn-swap { background: #14B8A6 !important; }

        .split-container {
            display: flex;
            flex: 1;
            gap: 20px;
            position: relative;
        }
        .table-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .table-title {
            color: var(--info-color);
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .countdown { font-size:var(--timer-font-size); font-weight:900; color:var(--timer-color); letter-spacing:2px; }
        .stage-tag { font-size:20px; color:var(--info-color); font-weight:50px; }
        .info-grid { display:flex; gap:24px; }
        .info-item { text-align:center; color:var(--info-color); }
        .info-label { font-size:16px; opacity:0.8; }
        .info-value { font-size:36px; font-weight:700; }
        .bottom-buttons {
            display:flex;
            justify-content:center;
            gap:12px;
            margin-bottom:10px;
        }
        .split-middle {
            position: absolute;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .divider {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 80px;
            width: 2px;
            background: var(--info-color);
            transform: translateX(-50%);
        }
        .single-wrap {
            flex:1;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .timer-center {
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:10px;
        }
        .split-btn-wrap {
            position: absolute;
            left: 30px;
            bottom: 100px;
        }
        .hidden { display: none !important; }

        .footer {
            text-align:center;
            color:rgba(255,255,255,0.5);
            font-size:12px;
        }
        .modal {
            position:fixed;
            left: 30px;
            bottom: 120px;
            background:rgba(0,0,0,0.7);
            z-index:999;
            opacity:0;
            pointer-events:none;
            transition:0.3s;
        }
        .modal.active { opacity:1; pointer-events:auto; }
        .modal-box {
            background:#1E293B;
            width: 95%;
            max-width: 800px;
            margin: auto;
            padding:24px;
            border-radius:20px;
            color:white;
            box-sizing: border-box;
            overflow: hidden;
        }
        .modal-header { display:flex; justify-content:space-between; margin-bottom:16px; }
        .close { cursor:pointer; font-size:22px; }
        .table-header {
            display:grid;
            grid-template-columns:70px 100px 120px 120px 100px 80px;
            gap:10px;
            font-weight:bold;
            margin-bottom:8px;
        }
        .level-row {
            display:grid;
            grid-template-columns:70px 100px 120px 120px 100px 80px;
            gap:10px;
            margin-bottom:10px;
            align-items:center;
        }
        .level-row input { padding:6px; background:#272e3a; border:1px solid #444; color:white; border-radius:6px; text-align:center; }
        .add-level, .save-btn { margin-top:10px; padding:8px 16px; background:var(--primary); color:white; border:none; border-radius:8px; cursor:pointer; }
        .save-btn { background:var(--success); width:100%; }
        @keyframes pulse { 0%{transform:scale(1);}50%{transform:scale(1.03);}100%{transform:scale(1);} }
        .pulse { animation:pulse 1s infinite; color:var(--warning); }
        #passwordOverlay { position:fixed; inset:0; background:#0F252A; z-index:9999; display:flex; align-items:center; justify-content:center; color:white; }
        .pwd-box { text-align:center; }
        .pwd-box input { padding:12px 16px; margin:10px 0; border-radius:10px; border:2px solid var(--primary); background:#1E293B; color:white; font-size:16px; }
        .pwd-box button { padding:10px 20px; background:var(--success); color:white; border:none; border-radius:10px; cursor:pointer; }
        .final-set-box { display:flex; align-items:center; gap:10px; margin:10px 0; }
    </style>
</head>
<body>

<div id="passwordOverlay">
    <div class="pwd-box">
        <h2>火石竞技</h2>
        <p>请输入访问密码</p>
        <input type="password" id="pwdInput" placeholder="输入密码">
        <br><br>
        <button onclick="checkPassword()">确认进入</button>
    </div>
</div>

<div class="container" id="mainContainer" style="display:none;">
    <div class="top-bar">
        <div class="logo-area">
            <div class="logo-box">
                <img src="LOGO-透明绿色.png" class="logo-img" id="logoImg">
            </div>
            <div class="logo-text">火石竞技</div>
        </div>
        <div class="btn-group">
            <button class="btn btn-setting" id="normalSet"><i class="fas fa-cog"></i> 常规设置</button>
            <button class="btn btn-final-set" id="finalSet"><i class="fas fa-crown"></i> 决赛设置</button>
            <button class="btn btn-image" id="imgSet"><i class="fas fa-palette"></i> 界面设置</button>
        </div>
    </div>

    <div class="single-wrap" id="singleWrap">
        <div class="timer-center">
            <div class="countdown" id="time">10:00</div>
            <div class="stage-tag" id="stage">常规赛 - 第 1 级</div>
            <div class="info-grid">
                <div class="info-item"><div class="info-label">等级</div><div class="info-value" id="level">1</div></div>
                <div class="info-item"><div class="info-label">小盲</div><div class="info-value" id="sb">100</div></div>
                <div class="info-item"><div class="info-label">大盲</div><div class="info-value" id="bb">200</div></div>
                <div class="info-item"><div class="info-label">ANTE</div><div class="info-value" id="ante">0</div></div>
            </div>
        </div>
    </div>

    <div class="split-container hidden" id="splitWrap">
        <div class="divider"></div>
        <div class="table-panel" id="panel2">
            <div class="table-title">桌 2</div>
            <div class="countdown" id="t2_time">10:00</div>
            <div class="stage-tag" id="t2_stage">常规赛 - 第 1 级</div>
            <div class="info-grid">
                <div class="info-item"><div class="info-label">等级</div><div class="info-value" id="t2_level">1</div></div>
                <div class="info-item"><div class="info-label">小盲</div><div class="info-value" id="t2_sb">100</div></div>
                <div class="info-item"><div class="info-label">大盲</div><div class="info-value" id="t2_bb">200</div></div>
                <div class="info-item"><div class="info-label">ANTE</div><div class="info-value" id="t2_ante">0</div></div>
            </div>
            <div class="bottom-buttons">
                <button class="btn btn-start" id="t2_start">开始</button>
                <button class="btn btn-pause" id="t2_pause" disabled>暂停</button>
                <button class="btn btn-reset" id="t2_reset">新局</button>
                <button class="btn btn-jump" id="t2_jumpBtn"><i class="fas fa-teleport"></i> 穿越</button>
                <button class="btn btn-final" id="t2_finalMode">决赛</button>
                <button class="btn btn-close" id="t2_close">关闭</button>
            </div>
        </div>

        <div class="table-panel" id="panel1">
            <div class="table-title">桌 1</div>
            <div class="countdown" id="t1_time">10:00</div>
            <div class="stage-tag" id="t1_stage">常规赛 - 第 1 级</div>
            <div class="info-grid">
                <div class="info-item"><div class="info-label">等级</div><div class="info-value" id="t1_level">1</div></div>
                <div class="info-item"><div class="info-label">小盲</div><div class="info-value" id="t1_sb">100</div></div>
                <div class="info-item"><div class="info-label">大盲</div><div class="info-value" id="t1_bb">200</div></div>
                <div class="info-item"><div class="info-label">ANTE</div><div class="info-value" id="t1_ante">0</div></div>
            </div>
            <div class="bottom-buttons">
                <button class="btn btn-start" id="t1_start">开始</button>
                <button class="btn btn-pause" id="t1_pause" disabled>暂停</button>
                <button class="btn btn-reset" id="t1_reset">新局</button>
                <button class="btn btn-jump" id="t1_jumpBtn"><i class="fas fa-teleport"></i> 穿越</button>
                <button class="btn btn-final" id="t1_finalMode">决赛</button>
                <button class="btn btn-close" id="t1_close">关闭</button>
            </div>
        </div>

        <div class="split-middle">
            <button class="btn btn-swap" id="swapBtn"><i class="fas fa-exchange-alt"></i> 对调</button>
            <button class="btn btn-merge" id="mergeBtn"><i class="fas fa-compress"></i> 合屏</button>
        </div>
    </div>

    <div class="bottom-buttons" id="singleButtons">
        <button class="btn btn-start" id="start">开始</button>
        <button class="btn btn-pause" id="pause" disabled>暂停</button>
        <button class="btn btn-reset" id="reset">新局</button>
        <button class="btn btn-jump" id="jumpBtn"><i class="fas fa-teleport"></i> 穿越</button>
        <button class="btn btn-final" id="finalMode">决赛</button>
    </div>

    <div class="split-btn-wrap" id="splitBtnWrap">
        <button class="btn btn-split" id="splitBtn"><i class="fas fa-grip-vertical"></i> 分屏</button>
    </div>

    <div class="footer">火石竞技 © 2026 专业赛事计时器 | BOBO开发</div>
</div>

<!-- 弹窗 -->
<div class="modal" id="normalModal"><div class="modal-box"><div class="modal-header"><div>常规级别设置</div><div class="close" onclick="closeModal('normalModal')">×</div></div><div class="table-header"><div>级别</div><div>时长</div><div>小盲</div><div>大盲</div><div>ANTE</div><div>操作</div></div><div id="normalLevelList"></div><button class="add-level" onclick="addLevel()">增加级别</button><button class="save-btn" onclick="saveNormal()">保存设置</button></div></div>
<div class="modal" id="finalModal"><div class="modal-box"><div class="modal-header"><div>决赛设置</div><div class="close" onclick="closeModal('finalModal')">×</div></div><div class="final-set-box"><label>每级时长（分钟）：</label><input type="number" id="finalTime" value="5" style="width:80px;"></div><button class="save-btn" onclick="saveFinal()">保存</button></div></div>
<div class="modal" id="imgModal"><div class="modal-box"><div class="modal-header"><div>界面设置</div><div class="close" onclick="closeModal('imgModal')">×</div></div><div style="margin-bottom:16px;"><label>俱乐部LOGO：</label><br><input type="file" id="logoFile" accept="image/*"><br><button onclick="setLogo()" style="margin-top:6px;padding:6px 12px;background:var(--primary);color:white;border:none;border-radius:8px;">应用LOGO</button></div><div style="margin-bottom:16px;"><label>背景图片：</label><br><input type="file" id="bgFile" accept="image/*"><br><button onclick="setBg()" style="margin-top:6px;padding:6px 12px;background:var(--primary);color:white;border:none;border-radius:8px;">应用背景</button></div><div style="margin-bottom:16px;"><label>倒计时文字颜色：</label><br><input type="color" id="timerColor" value="#ffffff"><br><br><label>等级盲注文字颜色：</label><br><input type="color" id="infoColor" value="#ffffff"><br><br><label>倒计时字体大小（px）：</label><br><input type="number" id="timerSize" value="120" style="width:100px;"><br></div><button onclick="saveColors()" style="padding:8px 16px;background:var(--success);color:white;border:none;border-radius:8px;">保存配色与字体</button></div></div>
<div class="modal" id="jumpModal"><div class="modal-box"><div class="modal-header"><div>级别穿越</div><div class="close" onclick="closeModal('jumpModal')">×</div></div><div style="margin:20px 0;"><label>请输入目标级别：</label><input type="number" id="jumpLevel" min="1" placeholder="输入数字" style="width:100%; padding:10px; margin-top:10px; background:#272e3a; border:1px solid #444; color:white; border-radius:6px;"></div><button class="save-btn" onclick="confirmJump()">确认穿越</button></div></div>

<script>
// ========================== 登录 ==========================
function checkPassword() {
    const val = $('pwdInput').value.trim();
    const now = new Date();
    if (val === 'fr2026') { login(); return; }
    const list = [
        { pwd: 'a1b2', s: '2026-04-01', e: '2026-06-30' },
        { pwd: 'ajax', s: '2026-07-01', e: '2026-09-30' },
        { pwd: 'manc', s: '2026-10-01', e: '2026-12-31' }
    ];
    for (let item of list) {
        const s = new Date(item.s);
        const e = new Date(item.e);
        if (val === item.pwd && now >= s && now <= e) { login(); return; }
    }
    alert('密码错误或已过期');
}
function login() {
    $('passwordOverlay').style.display = 'none';
    $('mainContainer').style.display = 'flex';
    init();
}

// ========================== 存储 ==========================
const storage = {
    save: (k, d) => localStorage.setItem(k, JSON.stringify(d)),
    load: (k, def) => { const d = localStorage.getItem(k); return d ? JSON.parse(d) : def; }
};

let normalLevels = storage.load('normalLevels', [
    {time:10,sb:100,bb:200,ante:0},{time:10,sb:200,bb:400,ante:0},
    {time:10,sb:400,bb:800,ante:25},{time:10,sb:800,bb:1600,ante:50},
    {time:10,sb:1600,bb:3200,ante:100},{time:10,sb:3200,bb:6400,ante:200},
    {time:10,sb:6400,bb:12800,ante:400},{time:10,sb:12800,bb:25600,ante:800},
    {time:10,sb:25600,bb:51200,ante:1600},{time:10,sb:51200,bb:102400,ante:3200}
]);

let finalTime = storage.load('finalTime',5);

// 双桌数据
let table = {
    main: { running:false, timer:null, isFinal:false, currLevel:1, timeLeft:normalLevels[0].time*60 },
    t1: { running:false, timer:null, isFinal:false, currLevel:1, timeLeft:normalLevels[0].time*60 },
    t2: { running:false, timer:null, isFinal:false, currLevel:1, timeLeft:normalLevels[0].time*60 }
};

const $ = id => document.getElementById(id);
let currentJumpTarget = 'main';

// ========================== 声音 ==========================
function playBeep(){
    try{let a=new (window.AudioContext||window.webkitAudioContext)(),b=a.createOscillator(),c=a.createGain();b.connect(c),c.connect(a.destination),b.frequency.value=950,c.gain.value=.3,b.start(),b.stop(a.currentTime+.15)}catch(a){}}

// ========================== 时间格式化 ==========================
function fmt(t){const m=String(Math.floor(t/60)).padStart(2,'0');const s=String(t%60).padStart(2,'0');return m+':'+s;}

// ========================== 刷新界面 ==========================
function refresh(tbl='main'){
    const d=table[tbl];const cfg=normalLevels[d.currLevel-1];
    if(tbl==='main'){
        $('time').innerText=fmt(d.timeLeft);$('level').innerText=d.currLevel;
        $('sb').innerText=cfg.sb.toLocaleString();$('bb').innerText=cfg.bb.toLocaleString();$('ante').innerText=cfg.ante.toLocaleString();
        $('stage').innerText=(d.isFinal?'决赛圈':'常规赛')+' - 第 '+d.currLevel+' 级';
        d.timeLeft<=10&&d.running?$('time').classList.add('pulse'):$('time').classList.remove('pulse');
        $('start').disabled = d.running;
        $('pause').disabled = !d.running;
    }
    if(tbl==='t1'){
        $('t1_time').innerText=fmt(d.timeLeft);$('t1_level').innerText=d.currLevel;
        $('t1_sb').innerText=cfg.sb.toLocaleString();$('t1_bb').innerText=cfg.bb.toLocaleString();$('t1_ante').innerText=cfg.ante.toLocaleString();
        $('t1_stage').innerText=(d.isFinal?'决赛圈':'常规赛')+' - 第 '+d.currLevel+' 级';
        d.timeLeft<=10&&d.running?$('t1_time').classList.add('pulse'):$('t1_time').classList.remove('pulse');
        $('t1_start').disabled = d.running;
        $('t1_pause').disabled = !d.running;
    }
    if(tbl==='t2'){
        $('t2_time').innerText=fmt(d.timeLeft);$('t2_level').innerText=d.currLevel;
        $('t2_sb').innerText=cfg.sb.toLocaleString();$('t2_bb').innerText=cfg.bb.toLocaleString();$('t2_ante').innerText=cfg.ante.toLocaleString();
        $('t2_stage').innerText=(d.isFinal?'决赛圈':'常规赛')+' - 第 '+d.currLevel+' 级';
        d.timeLeft<=10&&d.running?$('t2_time').classList.add('pulse'):$('t2_time').classList.remove('pulse');
        $('t2_start').disabled = d.running;
        $('t2_pause').disabled = !d.running;
    }
}

// ========================== 开始 / 暂停 / 新局 / 决赛 ==========================
function start(tbl='main'){
    if(table[tbl].running)return;
    table[tbl].running = true;
    refresh(tbl);
    table[tbl].timer = setInterval(()=>{
        table[tbl].timeLeft--;
        refresh(tbl);

 // 新增：最后10秒每秒播放提示音
        if(table[tbl].timeLeft > 0 && table[tbl].timeLeft <= 10){
            playBeep();
        }

        if(table[tbl].timeLeft <= 0){
            table[tbl].currLevel = Math.min(table[tbl].currLevel+1, normalLevels.length);
            table[tbl].timeLeft = (table[tbl].isFinal ? finalTime : normalLevels[table[tbl].currLevel-1].time) * 60;
        }
    }, 1000);
}
function pause(tbl='main'){
    table[tbl].running = false;
    clearInterval(table[tbl].timer);
    table[tbl].timer = null;
    refresh(tbl);
}
function reset(tbl='main'){
    pause(tbl);
    const d = table[tbl];
    d.isFinal = false;
    d.currLevel = 1;
    d.timeLeft = normalLevels[0].time * 60;
    refresh(tbl);
}
function goFinal(tbl='main'){
    pause(tbl);
    const d = table[tbl];
    d.isFinal = true;
    d.timeLeft = finalTime * 60;
    refresh(tbl);
    start(tbl);
}

// ========================== 穿越 ==========================
function openJumpModal(tbl='main'){
    currentJumpTarget = tbl;
    openModal('jumpModal');
    $('jumpLevel').value = '';
    $('jumpLevel').focus();
}
function confirmJump(){
    const t = currentJumpTarget;
    const v = ~~$('jumpLevel').value;
    if(v < 1 || v > normalLevels.length){ alert('输入无效等级'); return; }
    pause(t);
    table[t].currLevel = v;
    table[t].timeLeft = (table[t].isFinal ? finalTime : normalLevels[v-1].time) * 60;
    refresh(t);
    closeModal('jumpModal');
    start(t);
}

// ========================== 分屏 / 合屏 / 关闭 / 对调 (已修复状态继承) ==========================
function deepCopy(obj) {
    return JSON.parse(JSON.stringify(obj));
}
function enterSplit(){
    pause('main');
    table.t1 = deepCopy(table.main);
    table.t2 = deepCopy(table.main);
    reset('t2');
    refresh('t1');
    refresh('t2');
    if(table.t1.running){
        start('t1');
    }
    $('singleWrap').classList.add('hidden');
    $('singleButtons').classList.add('hidden');
    $('splitBtnWrap').classList.add('hidden');
    $('splitWrap').classList.remove('hidden');
}
function enterMerge(){
    pause('t1');
    pause('t2');
    table.main = deepCopy(table.t1);
    refresh('main');
    if(table.main.running){
        start('main');
    }
    $('splitWrap').classList.add('hidden');
    $('singleWrap').classList.remove('hidden');
    $('singleButtons').classList.remove('hidden');
    $('splitBtnWrap').classList.remove('hidden');
}
function closeTable(closedTbl){
    const remainTbl = closedTbl === 't1' ? 't2' : 't1';
    pause('t1');
    pause('t2');
    table.main = deepCopy(table[remainTbl]);
    refresh('main');
    if(table.main.running){
        start('main');
    }
    $('splitWrap').classList.add('hidden');
    $('singleWrap').classList.remove('hidden');
    $('singleButtons').classList.remove('hidden');
    $('splitBtnWrap').classList.remove('hidden');
}
function swapTables(){
    [table.t1, table.t2] = [table.t2, table.t1];
    refresh('t1');
    refresh('t2');
}

// ========================== 设置 ==========================
function openModal(id){$(id).classList.add('active');}
function closeModal(id){$(id).classList.remove('active');}
function renderNormal(){
    let h = '';
    normalLevels.forEach((it, i)=>{
        const del = normalLevels.length > 1
            ? `<button onclick="deleteLevel(${i})" style="padding:6px;background:red;border:none;border-radius:6px;color:white">删除</button>`
            : '至少1行';
        h += `<div class="level-row">
            <div>第${i+1}级</div>
            <input value="${it.time}" data-key="time">
            <input value="${it.sb}" data-key="sb">
            <input value="${it.bb}" data-key="bb">
            <input value="${it.ante}" data-key="ante">
            <div>${del}</div>
        </div>`;
    });
    $('normalLevelList').innerHTML = h;
}
function addLevel(){
    normalLevels.push({time:10, sb:100, bb:200, ante:0});
    renderNormal();
}
function deleteLevel(i){
    if(!confirm('确定删除？')) return;
    normalLevels.splice(i, 1);
    renderNormal();
}
function saveNormal(){
    const r = $('normalLevelList').querySelectorAll('.level-row');
    normalLevels = [];
    r.forEach(x => {
        normalLevels.push({
            time: ~~x.querySelector('[data-key=time]').value || 10,
            sb: ~~x.querySelector('[data-key=sb]').value || 100,
            bb: ~~x.querySelector('[data-key=bb]').value || 200,
            ante: ~~x.querySelector('[data-key=ante]').value || 0
        });
    });
    storage.save('normalLevels', normalLevels);
    closeModal('normalModal');
    reset('main'); reset('t1'); reset('t2');
}
function saveFinal(){
    finalTime = ~~$('finalTime').value || 5;
    storage.save('finalTime', finalTime);
    closeModal('finalModal');
}

// ========================== 界面设置 ==========================
function setLogo(){
    const f = $('logoFile').files[0];
    if(!f) return;
    const u = URL.createObjectURL(f);
    $('logoImg').src = u;
}
function setBg(){
    const f = $('bgFile').files[0];
    if(!f) return;
    const u = URL.createObjectURL(f);
    document.body.background = 'none';
    document.body.backgroundImage = `url(${u})`;
    document.body.backgroundSize = 'cover';
}
function saveColors(){
    const tc = $('timerColor').value;
    const ic = $('infoColor').value;
    const size = $('timerSize').value || 120;
    document.documentElement.style.setProperty('--timer-color', tc);
    document.documentElement.style.setProperty('--info-color', ic);
    document.documentElement.style.setProperty('--timer-font-size', size+'px');
    storage.save('colors', {tc, ic, size});
    closeModal('imgModal');
}

// ========================== 初始化 ==========================
function init(){
    const c = storage.load('colors', {tc:'#fff', ic:'#fff', size:120});
    document.documentElement.style.setProperty('--timer-color', c.tc);
    document.documentElement.style.setProperty('--info-color', c.ic);
    document.documentElement.style.setProperty('--timer-font-size', c.size+'px');
    $('timerColor').value = c.tc;
    $('infoColor').value = c.ic;
    $('timerSize').value = c.size;
    $('finalTime').value = finalTime;
    refresh('main');
    refresh('t1');
    refresh('t2');
}

// ========================== 绑定事件 ==========================
$('start').onclick = ()=>start('main');
$('pause').onclick = ()=>pause('main');
$('reset').onclick = ()=>reset('main');
$('finalMode').onclick = ()=>goFinal('main');
$('jumpBtn').onclick = ()=>openJumpModal('main');

$('t1_start').onclick = ()=>start('t1');
$('t1_pause').onclick = ()=>pause('t1');
$('t1_reset').onclick = ()=>reset('t1');
$('t1_finalMode').onclick = ()=>goFinal('t1');
$('t1_jumpBtn').onclick = ()=>openJumpModal('t1');
$('t1_close').onclick = ()=>closeTable('t1');

$('t2_start').onclick = ()=>start('t2');
$('t2_pause').onclick = ()=>pause('t2');
$('t2_reset').onclick = ()=>reset('t2');
$('t2_finalMode').onclick = ()=>goFinal('t2');
$('t2_jumpBtn').onclick = ()=>openJumpModal('t2');
$('t2_close').onclick = ()=>closeTable('t2');

$('splitBtn').onclick = enterSplit;
$('mergeBtn').onclick = enterMerge;
$('swapBtn').onclick = swapTables;

$('normalSet').onclick = ()=>{renderNormal(); openModal('normalModal');};
$('finalSet').onclick = ()=>openModal('finalModal');
$('imgSet').onclick = ()=>openModal('imgModal');

document.addEventListener('keydown', e=>{
    if(e.code === 'Space'){
        e.preventDefault();
        table.main.running ? pause('main') : start('main');
    }
});
</script>
</body>
</html>
